# Shared setup for building code-map in the cloud.
#
# `Cargo.toml` points at `../makepad`, so a build needs two directories side by
# side, one level above the repository root:
#
#   <workspace>          <- this repository, checked out with `path: .`
#   ../makepad           <- makepad, pinned to the commit the README requires
#
# The repository must be at the workspace root, not in a subdirectory: a local
# action (`uses: ./.github/actions/setup`) is always resolved from the workspace
# root, so a checkout with `path: code-map` makes this action invisible to the
# runner.
#
# This composite action creates the makepad checkout at the pinned commit and
# wires up the dependency caches.
name: Setup makepad checkout and caches
description: Clone makepad at the pinned commit next to code-map and configure Rust caches

inputs:
  makepad-repo:
    description: Repository URL for the makepad checkout
    required: false
    default: https://github.com/makepad/makepad.git
  makepad-commit:
    description: Commit of makepad to build against
    required: false
    default: a4ea2536a4ab223fb31e0282be923191230f44fe
  cache-target:
    description: Cache the makepad target directory (false for analysis-only jobs)
    required: false
    default: "true"

outputs:
  lock-hash:
    description: Hash of Cargo.lock, part of every cache key
    value: ${{ steps.key.outputs.lock-hash }}

runs:
  using: composite
  steps:
    # Computed in one place so the cache keys below are plain substitutions and
    # the lockfile stays the only thing that invalidates a warm build.
    - name: Compute the cache key
      id: key
      shell: bash
      run: echo "lock-hash=${{ hashFiles('Cargo.lock') }}" >> "$GITHUB_OUTPUT"

    # This crate declares `[workspace]`, so it is the workspace root and cargo
    # writes to <repo>/target. Cache it per OS: debug and release artifacts
    # share that directory, so one key per OS is enough.
    - name: Cache build output
      if: inputs.cache-target == 'true'
      uses: actions/cache@v4
      with:
        path: target
        key: code-map-target-${{ runner.os }}-${{ inputs.makepad-commit }}-${{ steps.key.outputs.lock-hash }}
        restore-keys: |
          code-map-target-${{ runner.os }}-${{ inputs.makepad-commit }}-
          code-map-target-${{ runner.os }}-

    # The crates.io registry is small and saves real time on Windows and macOS.
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: code-map-cargo-${{ runner.os }}-${{ steps.key.outputs.lock-hash }}
        restore-keys: |
          code-map-cargo-${{ runner.os }}-

    # A full clone is ~420 MB, so fetch just the pinned commit: the server can
    # serve a commit by SHA and one commit is all this build needs.
    - name: Check out makepad at the pinned commit
      shell: bash
      env:
        MAKEPAD_REPO: ${{ inputs.makepad-repo }}
        MAKEPAD_COMMIT: ${{ inputs.makepad-commit }}
        # Sibling of the repository, so `../makepad` in Cargo.toml resolves.
        MAKEPAD_DIR: ${{ github.workspace }}/../makepad
      run: |
        set -euo pipefail

        if [ ! -d "$MAKEPAD_DIR" ]; then
          git init -q "$MAKEPAD_DIR"
          git -C "$MAKEPAD_DIR" remote add origin "$MAKEPAD_REPO"
        fi

        have=$(git -C "$MAKEPAD_DIR" rev-parse --verify --quiet HEAD || true)
        if [ "$have" != "$MAKEPAD_COMMIT" ]; then
          git -C "$MAKEPAD_DIR" fetch --depth 1 origin "$MAKEPAD_COMMIT"
          git -C "$MAKEPAD_DIR" checkout --detach -q FETCH_HEAD
        fi

        head_sha=$(git -C "$MAKEPAD_DIR" rev-parse HEAD)
        if [ "$head_sha" != "$MAKEPAD_COMMIT" ]; then
          echo "::error::makepad is at $head_sha, expected $MAKEPAD_COMMIT"
          exit 1
        fi
        echo "makepad @ $head_sha -> $MAKEPAD_DIR"

    # Guard rail: turn a wrong working directory into one clear error instead of
    # a confusing "failed to load manifest for dependency makepad-widgets".
    - name: Verify the layout Cargo.toml expects
      shell: bash
      run: |
        set -euo pipefail
        for path in Cargo.toml ../makepad/Cargo.toml ../makepad/widgets/Cargo.toml; do
          if [ ! -f "$path" ]; then
            echo "::error::missing $path - check out this repository at the workspace root (path: .)"
            exit 1
          fi
        done
        echo "layout ok: $(pwd) with ../makepad present"
