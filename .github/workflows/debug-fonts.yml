# Temporary diagnostic: why does the Windows runner not have makepad's fonts?
# Manual runs only. Delete once the cause is known.
name: Debug fonts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: .

      - name: Clone makepad exactly like the setup action does
        shell: bash
        run: |
          git init -q ../makepad
          git -C ../makepad remote add origin https://github.com/makepad/makepad.git
          git -C ../makepad fetch --depth 1 origin a4ea2536a4ab223fb31e0282be923191230f44fe
          git -C ../makepad checkout --detach -q FETCH_HEAD
          echo "makepad @ $(git -C ../makepad rev-parse HEAD)"

      - name: Probe the resources directory
        shell: bash
        run: |
          echo "== os: $RUNNER_OS =="
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "pwd=$(pwd)"

          src="$GITHUB_WORKSPACE/../makepad/widgets/resources"
          echo "-- does the literal path exist?"
          if [ -d "$src" ]; then echo "YES  $src"; else echo "NO   $src"; fi

          echo "-- resolved:"
          ( cd "$GITHUB_WORKSPACE/.." && pwd && ls -d makepad/widgets/resources 2>&1 )

          echo "-- top-level entries of the widgets directory:"
          ls "$GITHUB_WORKSPACE/../makepad/widgets" 2>&1 | head

          echo "-- entries of the resources directory (count + first 20):"
          ls -la "$src" 2>&1 | head -25

          echo "-- counts:"
          echo "   all entries : $(ls "$src" 2>/dev/null | wc -l)"
          echo "   *.ttf       : $(ls "$src"/*.ttf 2>/dev/null | wc -l)"
          echo "   *.otf       : $(ls "$src"/*.otf 2>/dev/null | wc -l)"

          echo "-- what git says is tracked in that directory:"
          git -C "$GITHUB_WORKSPACE/../makepad" ls-tree -r --name-only HEAD widgets/resources | wc -l

          echo "-- the exact copy the workflow does, then list the result:"
          rm -rf probe-stage
          mkdir -p probe-stage/makepad_widgets
          cp -R "$src" probe-stage/makepad_widgets/resources
          echo "   copy exit: $?"
          echo "   staged *.ttf: $(ls probe-stage/makepad_widgets/resources/*.ttf 2>/dev/null | wc -l)"
          echo "   staged entries: $(ls probe-stage/makepad_widgets/resources 2>/dev/null | wc -l)"

          echo "-- the exact find the workflow does:"
          find probe-stage -type f \( -name '*.ttf' -o -name '*.otf' \) | sed 's|^probe-stage/||' | sort -u | head -20
          echo "   find produced: $(find probe-stage -type f \( -name '*.ttf' -o -name '*.otf' \) | wc -l) files"
