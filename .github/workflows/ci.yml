# Cloud build for code-map.
#
# Nothing here needs a local Rust toolchain: the runner checks out makepad at
# the pinned commit next to code-map, runs clippy and the tests, and builds and
# packages release binaries on Linux, macOS and Windows.
#
# Layout the runner ends up with, which is what `../makepad` in Cargo.toml wants
# and what the `./.github/actions/setup` reference below needs:
#
#   /home/runner/work/code-map/code-map      <- this repository
#   /home/runner/work/code-map/makepad       <- sibling, cloned by the setup action
#
# Every run uploads downloadable packages: see "Artifacts" on the run summary.
# Note: `cargo fmt --check` is deliberately NOT part of this pipeline - the
# sources use a compact hand-kept style that rustfmt would rewrite in every file.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback first: lint and tests on one OS.
  checks:
    name: clippy / test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # The repository goes to the workspace root: a local action (`uses: ./...`)
      # is resolved from there, never from a checkout subdirectory.
      - uses: actions/checkout@v4
        with:
          path: .

      - uses: ./.github/actions/setup
        with:
          # Analysis only, so there is no target directory worth caching.
          cache-target: "false"

      # The build-tree half of makepad's tools/linux_deps.sh: what a compile
      # needs, without the audio servers, drivers and codecs a run needs.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang ca-certificates libssl-dev \
            libx11-dev libxcursor-dev libxkbcommon-dev libxrandr-dev \
            libxi-dev libxinerama-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libglx-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

  # Release binaries for every desktop platform the repo documents.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: .

      - uses: ./.github/actions/setup

      # makepad links X11/Wayland/EGL/xkbcommon on Linux.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang ca-certificates libssl-dev \
            libx11-dev libxcursor-dev libxkbcommon-dev libxrandr-dev \
            libxi-dev libxinerama-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libglx-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev

      # MAKEPAD_PACKAGE_DIR makes makepad look for its resources next to the
      # executable instead of at the absolute path of the build machine (its
      # `option_env!` is baked in here, so this must be set while compiling
      # makepad-platform). Without it the binary can only find the fonts at
      # D:\a\code-map\makepad\... and every text draw silently produces no
      # glyphs: the map draws boxes and outlines but no code.
      - name: cargo build --release
        env:
          MAKEPAD_PACKAGE_DIR: "."
        run: cargo build --locked --release

      # The scan binary is the headless half of the app: running it proves the
      # build actually works, with no display and no GPU.
      - name: Smoke test the headless scan binary
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          "./target/release/scan${ext}" . | tee scan-smoke.txt
          grep -q "files," scan-smoke.txt

      # Stage the layout the packaged resource loader expects:
      #   stage/code-map, stage/scan, stage/locales/       (i18n.rs looks here)
      #   stage/code_map/resources/                        (our two faces)
      #   stage/makepad_widgets/resources/                 (makepad's own faces)
      # A `crate_resource("self:...")` in the app resolves to
      # "<crate name>/<path>" once packaged, and the crate name comes from the
      # script module path with '-' replaced by '_'.
      #
      # makepad's faces ride along even though the theme is re-pointed at ours:
      # any widget that still asks the theme for a face we do not override (the
      # italic and icon slots) would otherwise resolve to an empty family and
      # draw no glyphs at all, which is far worse than carrying the files.
      - name: Stage the package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/stage
          # cp -R creates the destination directory itself but not the parents of
          # it, so both crate directories have to exist before anything goes in.
          mkdir -p dist/stage/code_map dist/stage/makepad_widgets
          cp -R locales dist/stage/locales
          cp -R resources dist/stage/code_map/resources
          cp -R "$GITHUB_WORKSPACE/../makepad/widgets/resources" dist/stage/makepad_widgets/resources
          rm -f dist/stage/makepad_widgets/resources/*.txt
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp target/release/code-map.exe target/release/scan.exe dist/stage/
          else
            cp target/release/code-map target/release/scan dist/stage/
          fi
          echo "staged $(du -sh dist/stage | cut -f1):"
          find dist/stage -maxdepth 2 -type d | sort

      # Two checks that catch the failure this app already shipped once: text
      # silently missing because a font could not be loaded.
      #
      # First, every asset makepad's own manifest declares has to be in the
      # package. The manifest is a static in its own section ("makepad.font-assets.v1"
      # on ELF/PE, "__mp_font_v1" on Mach-O) and is the list of paths makepad can
      # ask for, so anything missing from the package is a family that can come up
      # empty.
      - name: Check makepad's own font assets are packaged
        shell: bash
        run: |
          set -euo pipefail
          exe=target/release/code-map
          [ "${RUNNER_OS}" = "Windows" ] && exe=target/release/code-map.exe

          python3 - "$exe" "${RUNNER_OS}" > manifest-assets.txt <<'PY'
          import sys
          data = open(sys.argv[1], "rb").read()
          marker = b"__mp_font_v1" if sys.argv[2] == "macOS" else b"makepad.font-assets.v1"
          assets = set()
          pos = data.find(marker)
          while pos != -1:
              for line in data[pos:pos + 8192].split(b"\0")[0].split(b"\n"):
                  if line.startswith(b"asset="):
                      assets.add(line[6:].decode("utf-8", "replace"))
              pos = data.find(marker, pos + 1)
          print("\n".join(sorted(assets)))
          PY
          find dist/stage -type f \( -name '*.ttf' -o -name '*.otf' \) \
            | sed 's|^dist/stage/||' | sort -u > shipped-assets.txt
          missing=$(comm -23 manifest-assets.txt shipped-assets.txt)
          if [ -n "$missing" ]; then
            echo "::error::makepad declares these assets but the package does not carry them:"
            echo "$missing"
            exit 1
          fi
          echo "all $(wc -l < manifest-assets.txt) of makepad's declared font assets are packaged"

      # Second, the faces the app itself draws with have to sit where the loader
      # will look. Nothing in a build can prove that on its own, so build the
      # makepad-free checker, put it in the staged layout and run it from there.
      - name: Check the staged package can find the app's fonts
        run: |
          cargo build --locked --release --bin fontcheck
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp target/release/fontcheck.exe dist/stage/
            cd dist/stage && ./fontcheck.exe
          else
            cp target/release/fontcheck dist/stage/
            cd dist/stage && ./fontcheck
          fi

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="code-map-${{ runner.os }}"
          cp -R dist/stage "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "code-map-${{ runner.os }}"
          Copy-Item dist/stage "dist/$name" -Recurse
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: code-map-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
